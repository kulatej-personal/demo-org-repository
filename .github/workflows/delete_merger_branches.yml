name: Delete merger branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-temp-branch:
    # Only run if PR is merged AND it's from the Automated Deployment workflow
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'Deployment Request:')
    runs-on: ubuntu-latest
    
    steps:
      - name: Check PR head branch name and delete if matching pattern
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const headRef = pr.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            core.info(`PR merged. Head branch: ${headRef}`);
            core.info(`PR title: ${pr.title}`);
            
            // Pattern: <any>_to_<any>_merger_<timestamp>
            const pattern = /.+_to_.+_merger_\d{8}_\d{6}$/;
            
            if (!pattern.test(headRef)) {
              core.info('Head branch does not match merger pattern; skipping delete.');
              return;
            }
            
            const ref = `heads/${headRef}`;
            
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref
              });
              core.info(`Deleted remote branch: ${headRef}`);
            } catch (error) {
              core.warning(`Failed to delete branch ${headRef}: ${error.message}`);
            }
