name: Automated Deployment - dbt Lineage Aware

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to deploy from'
        required: true
        type: string
      destination_branch:
        description: 'Destination branch to deploy to'
        required: true
        type: string
      github_token:
        description: 'GitHub Personal Access Token (PAT)'
        required: true
        type: string
      file_names:
        description: 'Comma-separated model names (extension optional). Lineage deps will be auto-resolved.'
        required: false
        type: string
      exclude_files:
        description: 'Files to exclude (comma-separated)'
        required: false
        type: string
        default: 'source.yml,relx_fivetran_connector_mapping.csv'
      resolve_lineage:
        description: 'Resolve full dbt lineage dependencies automatically'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-deployment-pr:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # ── 2. Git auth ───────────────────────────────────────────────────────────
      - name: Configure Git with Token
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git config --global url."https://x-access-token:${{ inputs.github_token }}@github.com/".insteadOf "https://github.com/"

      # ── 3. Validate branches ─────────────────────────────────────────────────
      - name: Validate branches exist
        run: |
          set -e
          git ls-remote --heads origin "${{ inputs.source_branch }}" | grep -q refs/heads || {
            echo "Error: Source branch '${{ inputs.source_branch }}' does not exist"; exit 1
          }
          git ls-remote --heads origin "${{ inputs.destination_branch }}" | grep -q refs/heads || {
            echo "Error: Destination branch '${{ inputs.destination_branch }}' does not exist"; exit 1
          }
          echo "✅ Both branches validated"

      # ── 4. Fetch both branches ────────────────────────────────────────────────
      - name: Fetch branches
        run: |
          git fetch origin "${{ inputs.source_branch }}"
          git fetch origin "${{ inputs.destination_branch }}"

      # ── 5. Set up Python ─────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      # ── 6. dbt Lineage Resolution + Source Validation ────────────────────────
      #
      #   This single Python script does everything in one pass:
      #     a) Checkout the SOURCE tree into /tmp/src_tree
      #     b) Checkout the DESTINATION tree into /tmp/dst_tree
      #     c) Build a full ref() dependency graph from all .sql files in source
      #     d) Expand the user-supplied model list to include all transitive deps
      #     e) Scan every staging .sql in the deploy set for source() calls
      #     f) Parse every sources.yml in the DESTINATION tree
      #     g) Emit:
      #          /tmp/lineage_files_to_deploy.txt  – one file path per line
      #          /tmp/missing_sources.txt           – "src.tbl (referenced in file)" lines
      #          /tmp/lineage_summary.txt           – human-readable summary
      # ─────────────────────────────────────────────────────────────────────────
      - name: Resolve dbt lineage and validate sources
        id: lineage
        run: |
          python3 << 'PYEOF'
          import os, re, sys, json
          from pathlib import Path
          import subprocess, yaml

          # ── helpers ──────────────────────────────────────────────────────────
          def git_tree_files(branch, suffix=None):
              """Return list of (path, content) for all files on a git branch."""
              result = subprocess.run(
                  ["git", "ls-tree", "-r", "--name-only", f"origin/{branch}"],
                  capture_output=True, text=True, check=True
              )
              files = result.stdout.strip().splitlines()
              if suffix:
                  files = [f for f in files if f.endswith(suffix)]
              return files

          def git_show(branch, path):
              result = subprocess.run(
                  ["git", "show", f"origin/{branch}:{path}"],
                  capture_output=True, text=True
              )
              return result.stdout if result.returncode == 0 else ""

          def extract_refs(sql):
              return set(re.findall(r"""\{\{\s*ref\s*\(\s*['"]([^'"]+)['"]\s*\)\s*\}\}""", sql, re.I))

          def extract_sources(sql):
              return set(re.findall(
                  r"""\{\{\s*source\s*\(\s*['"]([^'"]+)['"]\s*,\s*['"]([^'"]+)['"]\s*\)\s*\}\}""",
                  sql, re.I
              ))

          def model_name_from_path(path):
              return Path(path).stem

          # ── config ───────────────────────────────────────────────────────────
          src_branch  = os.environ.get("SOURCE_BRANCH",      "${{ inputs.source_branch }}")
          dst_branch  = os.environ.get("DESTINATION_BRANCH", "${{ inputs.destination_branch }}")
          file_names  = os.environ.get("FILE_NAMES",         "${{ inputs.file_names }}")
          resolve_lin = os.environ.get("RESOLVE_LINEAGE",    "${{ inputs.resolve_lineage }}").lower() == "true"

          # ── collect all .sql files on SOURCE branch ──────────────────────────
          print("📂 Collecting SQL files from source branch …")
          src_sql_files = git_tree_files(src_branch, suffix=".sql")

          # Build map:  model_name → repo_path
          model_map = {}      # name → path
          model_sql  = {}      # name → sql content
          for f in src_sql_files:
              name = model_name_from_path(f)
              sql  = git_show(src_branch, f)
              model_map[name] = f
              model_sql[name] = sql

          # ── build dependency graph ─────────────────────────────────────────
          # dep_graph[model] = set of model names it depends on (via ref())
          dep_graph = {}
          for name, sql in model_sql.items():
              dep_graph[name] = extract_refs(sql)

          def all_deps(model, visited=None):
              """Return all transitive dependencies of a model (upstream)."""
              if visited is None:
                  visited = set()
              if model in visited:
                  return visited
              visited.add(model)
              for dep in dep_graph.get(model, set()):
                  all_deps(dep, visited)
              return visited

          # ── resolve user-supplied file list ──────────────────────────────────
          raw_inputs = [f.strip() for f in file_names.split(",") if f.strip()] if file_names else []

          seed_models = set()
          not_found   = []
          for inp in raw_inputs:
              # strip extension if present
              stem = Path(inp).stem
              if stem in model_map:
                  seed_models.add(stem)
              else:
                  not_found.append(inp)

          # expand with lineage
          deploy_models = set(seed_models)
          if resolve_lin:
              for m in list(seed_models):
                  deploy_models |= all_deps(m)
              print(f"  Seed models     : {len(seed_models)}")
              print(f"  After lineage   : {len(deploy_models)}")
          else:
              print(f"  Models (no lineage expansion): {len(deploy_models)}")

          # ── map back to file paths ────────────────────────────────────────────
          deploy_paths = []
          for m in deploy_models:
              if m in model_map:
                  deploy_paths.append(model_map[m])

          # Also include files that were explicitly requested but might be
          # non-SQL (e.g. .csv seeds, .yml schema files) or found by full path
          extra_paths = []
          for inp in raw_inputs:
              if Path(inp).suffix:               # has explicit extension
                  src_all = git_tree_files(src_branch)
                  matches = [f for f in src_all if f.endswith(inp) or f == inp]
                  extra_paths.extend(matches)

          all_deploy_paths = sorted(set(deploy_paths + extra_paths))

          # ── source() validation ──────────────────────────────────────────────
          print("\n🔍 Scanning for source() references in deploy set …")
          referenced_sources = {}   # (src_name, tbl_name) → [model_files]
          for path in all_deploy_paths:
              sql = git_show(src_branch, path)
              for src_name, tbl_name in extract_sources(sql):
                  key = (src_name, tbl_name)
                  referenced_sources.setdefault(key, []).append(path)

          print(f"  Found {len(referenced_sources)} unique source() references")

          # Parse sources.yml files on DESTINATION branch
          print("\n📄 Parsing sources.yml on destination branch …")
          dst_all_files = git_tree_files(dst_branch)
          sources_yml_files = [
              f for f in dst_all_files
              if f.endswith("sources.yml") or f.endswith("source.yml") or "sources" in Path(f).name.lower()
              and f.endswith(".yml")
          ]

          defined_sources = set()   # set of (source_name, table_name)
          for yf in sources_yml_files:
              content = git_show(dst_branch, yf)
              try:
                  data = yaml.safe_load(content) or {}
                  for src_block in data.get("sources", []):
                      src_name = src_block.get("name", "")
                      for tbl in src_block.get("tables", []):
                          tbl_name = tbl.get("name", "")
                          defined_sources.add((src_name, tbl_name))
              except Exception as e:
                  print(f"  ⚠️  Could not parse {yf}: {e}")

          print(f"  Found {len(defined_sources)} defined sources across {len(sources_yml_files)} sources.yml files")

          # ── find missing sources ──────────────────────────────────────────────
          missing_sources = []
          for (src_name, tbl_name), referencing_files in referenced_sources.items():
              if (src_name, tbl_name) not in defined_sources:
                  missing_sources.append({
                      "source": src_name,
                      "table": tbl_name,
                      "referenced_in": referencing_files
                  })

          # ── write output files ────────────────────────────────────────────────
          with open("/tmp/lineage_files_to_deploy.txt", "w") as f:
              f.write("\n".join(all_deploy_paths))

          with open("/tmp/missing_sources.json", "w") as f:
              json.dump(missing_sources, f, indent=2)

          with open("/tmp/not_found_models.txt", "w") as f:
              f.write("\n".join(not_found))

          with open("/tmp/lineage_stats.json", "w") as f:
              json.dump({
                  "seed_count": len(seed_models),
                  "total_deploy": len(all_deploy_paths),
                  "missing_source_count": len(missing_sources),
                  "not_found_count": len(not_found),
                  "seed_models": sorted(seed_models),
                  "deploy_models": sorted(deploy_models),
              }, f, indent=2)

          print(f"\n✅ Resolved {len(all_deploy_paths)} files to deploy")
          if missing_sources:
              print(f"⚠️  {len(missing_sources)} source references NOT found in destination sources.yml")
          else:
              print("✅ All source() references are defined in destination branch")
          PYEOF
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          DESTINATION_BRANCH: ${{ inputs.destination_branch }}
          FILE_NAMES: ${{ inputs.file_names }}
          RESOLVE_LINEAGE: ${{ inputs.resolve_lineage }}

      # ── 7. Get changed files between branches ────────────────────────────────
      - name: Get changed files between branches
        id: check_changes
        run: |
          git diff --name-status --diff-filter=ACMR \
            "origin/${{ inputs.destination_branch }}...origin/${{ inputs.source_branch }}" \
            > /tmp/all_changed_files_with_status.txt || true

          git diff --name-only --diff-filter=ACMR \
            "origin/${{ inputs.destination_branch }}...origin/${{ inputs.source_branch }}" \
            > /tmp/all_changed_files.txt || true

          CHANGE_COUNT=$(wc -l < /tmp/all_changed_files.txt | xargs)
          echo "Found ${CHANGE_COUNT} changed files between branches"

          if [ "$CHANGE_COUNT" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 8. Intersect lineage list with actually-changed files ─────────────────
      - name: Filter deploy list to changed files only
        id: analyze_files
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          EXCLUDE_FILES="${{ inputs.exclude_files }}"
          IFS=',' read -ra EXCLUDE_ARRAY <<< "$EXCLUDE_FILES"

          DEPLOY_INPUT="/tmp/lineage_files_to_deploy.txt"
          CHANGED="/tmp/all_changed_files.txt"

          # If no specific file_names given → use all changed files (original behaviour)
          # If file_names given    → intersect lineage list with changed files
          FILE_NAMES_INPUT="${{ inputs.file_names }}"

          if [ -z "$FILE_NAMES_INPUT" ]; then
            # Full deployment mode — use all changed files
            cp "$CHANGED" /tmp/files_to_deploy_raw.txt
          else
            # Selective mode — only deploy files that are BOTH in lineage list
            # AND actually differ between branches
            comm -12 \
              <(sort "$DEPLOY_INPUT") \
              <(sort "$CHANGED") \
              > /tmp/files_to_deploy_raw.txt
          fi

          # Remove excluded files
          FILTERED=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            SKIP=false
            for ex in "${EXCLUDE_ARRAY[@]}"; do
              echo "$file" | grep -Fq "$ex" && SKIP=true
            done
            [ "$SKIP" = false ] && FILTERED="${FILTERED}${file}"$'\n'
          done < /tmp/files_to_deploy_raw.txt

          echo "$FILTERED" | grep -v '^$' > /tmp/files_to_deploy.txt || true

          DEPLOY_COUNT=$(grep -c '^' /tmp/files_to_deploy.txt 2>/dev/null || echo 0)
          echo "Files to deploy: ${DEPLOY_COUNT}"

          if [ "$DEPLOY_COUNT" -eq 0 ]; then
            echo "has_files_to_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files_to_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 9. Create merger branch ───────────────────────────────────────────────
      - name: Create merger branch
        id: create_branch
        if: steps.check_changes.outputs.has_changes == 'true' && steps.analyze_files.outputs.has_files_to_deploy == 'true'
        run: |
          set -e
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SRC=$(echo "${{ inputs.source_branch }}" | tr '[:upper:]' '[:lower:]' | sed 's/[\/ ]/_/g')
          DST=$(echo "${{ inputs.destination_branch }}" | tr '[:upper:]' '[:lower:]' | sed 's/[\/ ]/_/g')
          MERGER_BRANCH="${SRC}_to_${DST}_merger_${TIMESTAMP}"
          echo "merger_branch=${MERGER_BRANCH}" >> "$GITHUB_OUTPUT"

          git fetch origin "${{ inputs.destination_branch }}"
          git checkout -b "${MERGER_BRANCH}" "origin/${{ inputs.destination_branch }}"
          git push -u origin "${MERGER_BRANCH}"
          echo "✅ Merger branch: ${MERGER_BRANCH}"

      # ── 10. Deploy files ──────────────────────────────────────────────────────
      - name: Deploy files to merger branch
        id: cherry_pick
        if: steps.check_changes.outputs.has_changes == 'true' && steps.analyze_files.outputs.has_files_to_deploy == 'true'
        run: |
          set -e
          git checkout "${{ steps.create_branch.outputs.merger_branch }}"
          git fetch origin "${{ inputs.source_branch }}"

          declare -A FILE_STATUS_MAP
          while IFS=$'\t' read -r status file; do
            FILE_STATUS_MAP["$file"]="$status"
          done < /tmp/all_changed_files_with_status.txt

          DEPLOYED_NEW_FILES=""
          DEPLOYED_MODIFIED_FILES=""
          NEW_COUNT=0
          MODIFIED_COUNT=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "  Deploying: $file"
            git checkout "origin/${{ inputs.source_branch }}" -- "$file"
            git add "$file"
            STATUS="${FILE_STATUS_MAP[$file]}"
            if [ "$STATUS" = "A" ]; then
              DEPLOYED_NEW_FILES="${DEPLOYED_NEW_FILES}- ${file}"$'\n'
              NEW_COUNT=$((NEW_COUNT + 1))
            else
              DEPLOYED_MODIFIED_FILES="${DEPLOYED_MODIFIED_FILES}- ${file}"$'\n'
              MODIFIED_COUNT=$((MODIFIED_COUNT + 1))
            fi
          done < /tmp/files_to_deploy.txt

          echo "$DEPLOYED_NEW_FILES"     > /tmp/deployed_new_files.txt
          echo "$DEPLOYED_MODIFIED_FILES"> /tmp/deployed_modified_files.txt
          echo "$NEW_COUNT"              > /tmp/new_count.txt
          echo "$MODIFIED_COUNT"         > /tmp/modified_count.txt
          echo "$((NEW_COUNT + MODIFIED_COUNT))" > /tmp/deployed_count.txt

          echo "  New: ${NEW_COUNT}  Modified: ${MODIFIED_COUNT}"

      # ── 11. Commit and push ───────────────────────────────────────────────────
      - name: Commit changes
        if: steps.check_changes.outputs.has_changes == 'true' && steps.analyze_files.outputs.has_files_to_deploy == 'true'
        run: |
          git commit -m "Automated deployment from ${{ inputs.source_branch }} to ${{ inputs.destination_branch }}"
          git push origin "${{ steps.create_branch.outputs.merger_branch }}"
          echo "✅ Pushed merger branch"

      # ── 12. Create Pull Request with lineage summary + source warnings ─────────
      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true' && steps.analyze_files.outputs.has_files_to_deploy == 'true'
        id: create_pr
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ inputs.github_token }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          DESTINATION_BRANCH: ${{ inputs.destination_branch }}
          MERGER_BRANCH: ${{ steps.create_branch.outputs.merger_branch }}
          DEPLOYER: ${{ github.actor }}
          FILE_NAMES: ${{ inputs.file_names }}
        with:
          github-token: ${{ inputs.github_token }}
          script: |
            const fs   = require('fs');
            const read = (p, def='') => fs.existsSync(p) ? fs.readFileSync(p,'utf8') : def;

            const deployedNewFiles      = read('/tmp/deployed_new_files.txt');
            const deployedModifiedFiles = read('/tmp/deployed_modified_files.txt');
            const newCount              = read('/tmp/new_count.txt','0').trim();
            const modifiedCount         = read('/tmp/modified_count.txt','0').trim();
            const deployedCount         = read('/tmp/deployed_count.txt','0').trim();
            const notFoundModels        = read('/tmp/not_found_models.txt');
            const lineageStatsRaw       = read('/tmp/lineage_stats.json','{}');
            const missingSrcRaw         = read('/tmp/missing_sources.json','[]');
            const filesToDeployList     = read('/tmp/files_to_deploy.txt');

            let lineageStats = {};
            let missingSources = [];
            try { lineageStats  = JSON.parse(lineageStatsRaw); } catch(e) {}
            try { missingSources = JSON.parse(missingSrcRaw);  } catch(e) {}

            const src        = process.env.SOURCE_BRANCH      || '';
            const dst        = process.env.DESTINATION_BRANCH || '';
            const headBranch = process.env.MERGER_BRANCH      || '';
            const actor      = process.env.DEPLOYER           || '';
            const fileNames  = process.env.FILE_NAMES         || '';

            let body = '## 🚀 Deployment Request\n\n';
            body += `**Source Branch:** \`${src}\`\n`;
            body += `**Destination Branch:** \`${dst}\`\n`;
            body += `**Triggered by:** @${actor}\n\n`;

            // ── Lineage summary ──────────────────────────────────────────────
            if (fileNames) {
              body += '### 🌿 dbt Lineage Resolution\n\n';
              body += `**Mode:** Selective deployment with lineage expansion\n`;
              body += `**Seed models supplied:** ${lineageStats.seed_count ?? 0}\n`;
              body += `**Total models after lineage expansion:** ${lineageStats.deploy_models?.length ?? 0}\n`;
              if (lineageStats.seed_models?.length) {
                body += `\n<details><summary>Seed models</summary>\n\n`;
                lineageStats.seed_models.forEach(m => body += `- \`${m}\`\n`);
                body += `\n</details>\n\n`;
              }
              if (lineageStats.deploy_models?.length) {
                body += `<details><summary>All resolved models (${lineageStats.deploy_models.length})</summary>\n\n`;
                lineageStats.deploy_models.forEach(m => body += `- \`${m}\`\n`);
                body += `\n</details>\n\n`;
              }
            } else {
              body += '**Mode:** Full deployment (all changed files)\n\n';
            }

            // ── Deployment statistics ────────────────────────────────────────
            body += '### 📋 Deployment Summary\n\n';
            body += `**✅ Successfully deployed:** ${deployedCount} files (${newCount} new, ${modifiedCount} modified)\n`;

            if (notFoundModels.trim()) {
              const nfList = notFoundModels.trim().split('\n').filter(Boolean);
              body += `**❓ Models not found in source branch:** ${nfList.length}\n`;
            }

            body += '\n';

            if (deployedNewFiles.trim()) {
              body += '### ✨ New Files Deployed\n```\n' + deployedNewFiles + '```\n\n';
            }
            if (deployedModifiedFiles.trim()) {
              body += '### 📝 Modified Files Deployed\n```\n' + deployedModifiedFiles + '```\n\n';
            }

            // ── ⚠️ SOURCE WARNING BLOCK ──────────────────────────────────────
            if (missingSources.length > 0) {
              body += '---\n';
              body += '## ⚠️ SOURCE VALIDATION WARNINGS\n\n';
              body += `> **${missingSources.length} source reference(s) found in the deployed files are NOT defined in the destination branch \`sources.yml\`.**\n`;
              body += '> This may cause \`dbt run\` failures after merge. Please verify before merging.\n\n';
              body += '| Source Name | Table Name | Referenced In |\n';
              body += '|-------------|------------|---------------|\n';
              missingSources.forEach(ms => {
                const files = ms.referenced_in.join('<br>');
                body += `| \`${ms.source}\` | \`${ms.table}\` | ${files} |\n`;
              });
              body += '\n**Action required:** Add the missing source definitions to `sources.yml` on `' + dst + '` before running dbt.\n\n';
              body += '---\n\n';
            } else if (fileNames) {
              body += '### ✅ Source Validation Passed\n';
              body += 'All `source()` references in the deployed files are defined in the destination branch `sources.yml`.\n\n';
            }

            // ── Excluded files ───────────────────────────────────────────────
            body += '### 🔒 Excluded Files\n';
            body += '- source.yml\n- relx_fivetran_connector_mapping.csv\n\n';

            // ── Next Steps ───────────────────────────────────────────────────
            body += '### 📝 Next Steps\n';
            body += '1. Review the changes in this PR\n';
            body += '2. Resolve any ⚠️ source warnings above\n';
            body += '3. Approve and merge to deploy to `' + dst + '`\n';
            body += '4. **Manual Step:** Run your dbt jobs after merge\n';

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Deployment: ${src} → ${dst}`,
              head:  headBranch,
              base:  dst,
              body:  body,
            });

            core.info(`✅ PR #${pr.data.number} created: ${pr.data.html_url}`);
            return pr.data.number;

      # ── 13. Labels ────────────────────────────────────────────────────────────
      - name: Add labels to PR
        if: steps.check_changes.outputs.has_changes == 'true' && steps.analyze_files.outputs.has_files_to_deploy == 'true'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ inputs.github_token }}
          PR_NUMBER: ${{ steps.create_pr.outputs.result }}
        with:
          github-token: ${{ inputs.github_token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER || 0);
            if (!prNumber) return;
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: prNumber,
                labels: ['automated-deployment', 'deployment', 'dbt-lineage'],
              });
            } catch (e) {
              console.log('Could not add labels:', e.message);
            }

      # ── 14. Step Summary ──────────────────────────────────────────────────────
      - name: Summary - Success
        if: steps.check_changes.outputs.has_changes == 'true' && steps.analyze_files.outputs.has_files_to_deploy == 'true'
        run: |
          NEW_COUNT=$(cat /tmp/new_count.txt)
          MODIFIED_COUNT=$(cat /tmp/modified_count.txt)
          DEPLOYED_COUNT=$(cat /tmp/deployed_count.txt)
          MISSING_SRC=$(python3 -c "import json; d=json.load(open('/tmp/missing_sources.json')); print(len(d))" 2>/dev/null || echo 0)

          echo "## ✅ Deployment PR Created" >> "$GITHUB_STEP_SUMMARY"
          echo "**PR Number:** ${{ steps.create_pr.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Merger Branch:** \`${{ steps.create_branch.outputs.merger_branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Deployment Statistics" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Deployed: ${DEPLOYED_COUNT} files (${NEW_COUNT} new, ${MODIFIED_COUNT} modified)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MISSING_SRC" -gt 0 ]; then
            echo "- ⚠️ Missing source definitions: ${MISSING_SRC} — **check PR warnings**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ✅ All sources validated against destination sources.yml" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summary - No Changes
        if: steps.check_changes.outputs.has_changes == 'false' || steps.analyze_files.outputs.has_files_to_deploy == 'false'
        run: |
          echo "## ℹ️ No Changes to Deploy" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "false" ]; then
            echo "No differences found between branches." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All resolved files were excluded or had no changes." >> "$GITHUB_STEP_SUMMARY"
          fi
