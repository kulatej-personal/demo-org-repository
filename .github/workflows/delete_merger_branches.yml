name: Delete merger branches

on:
  workflow_run:
    workflows: ["Automated Deployment"]
    types:
      - completed
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-temp-branch:
    # Run if: (1) Automated Deployment succeeded AND (2) A deployment PR was merged
    if: |
      github.event_name == 'pull_request' && 
      github.event.pull_request.merged == true && 
      startsWith(github.event.pull_request.title, 'Deployment Request:') &&
      contains(github.event.pull_request.head.ref, '_merger_')
    runs-on: ubuntu-latest
    
    steps:
      - name: Wait for Automated Deployment workflow to complete
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            core.info('Waiting for Automated Deployment workflow to complete...');
            
            // Wait up to 5 minutes for the workflow to complete
            const maxAttempts = 30;
            const delayMs = 10000; // 10 seconds
            
            for (let i = 0; i < maxAttempts; i++) {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'automated-deployment.yml', // Adjust this to your actual workflow filename
                per_page: 5,
                status: 'completed'
              });
              
              // Check if the most recent run was successful
              const latestRun = runs.workflow_runs[0];
              if (latestRun && latestRun.conclusion === 'success') {
                core.info(`✅ Automated Deployment workflow completed successfully`);
                return;
              }
              
              core.info(`Attempt ${i + 1}/${maxAttempts}: Workflow not completed yet, waiting...`);
              await new Promise(resolve => setTimeout(resolve, delayMs));
            }
            
            core.warning('Automated Deployment workflow did not complete within timeout');
      
      - name: Delete merger branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const headRef = pr.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            core.info(`PR merged. Head branch: ${headRef}`);
            core.info(`PR title: ${pr.title}`);
            
            // Pattern: <any>_to_<any>_merger_<timestamp>
            const pattern = /.+_to_.+_merger_\d{8}_\d{6}$/;
            
            if (!pattern.test(headRef)) {
              core.info('Head branch does not match merger pattern; skipping delete.');
              return;
            }
            
            const ref = `heads/${headRef}`;
            
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref
              });
              core.info(`✅ Deleted remote branch: ${headRef}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${headRef} already deleted`);
              } else {
                core.warning(`Failed to delete branch ${headRef}: ${error.message}`);
              }
            }
