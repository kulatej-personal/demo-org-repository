name: Delete merger branches

on:
  workflow_run:
    workflows: ["Automated Deployment"]
    types:
      - completed
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-temp-branch:
    # Run if: (1) Automated Deployment succeeded, OR (2) A deployment PR was merged
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' && 
       github.event.pull_request.merged == true && 
       startsWith(github.event.pull_request.title, 'Deployment Request:') &&
       contains(github.event.pull_request.head.ref, '_merger_'))
    runs-on: ubuntu-latest
    
    steps:
      - name: Delete merger branch (from PR merge event)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const headRef = pr.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            core.info(`PR merged. Head branch: ${headRef}`);
            core.info(`PR title: ${pr.title}`);
            
            // Pattern: <any>_to_<any>_merger_<timestamp>
            const pattern = /.+_to_.+_merger_\d{8}_\d{6}$/;
            
            if (!pattern.test(headRef)) {
              core.info('Head branch does not match merger pattern; skipping delete.');
              return;
            }
            
            const ref = `heads/${headRef}`;
            
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref
              });
              core.info(`✅ Deleted remote branch: ${headRef}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${headRef} already deleted`);
              } else {
                core.warning(`Failed to delete branch ${headRef}: ${error.message}`);
              }
            }
      
      - name: Find and delete merged merger branches (from workflow completion)
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get all PRs that were created by the workflow
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 50
            });
            
            // Filter for merged PRs with "Deployment Request:" title and merger branches
            const mergerPRs = prs.filter(pr => 
              pr.merged_at &&
              pr.title.startsWith('Deployment Request:') &&
              pr.head.ref.includes('_merger_')
            );
            
            core.info(`Found ${mergerPRs.length} merged deployment PRs`);
            
            for (const pr of mergerPRs) {
              const headRef = pr.head.ref;
              const pattern = /.+_to_.+_merger_\d{8}_\d{6}$/;
              
              if (!pattern.test(headRef)) {
                core.info(`Skipping ${headRef} - doesn't match pattern`);
                continue;
              }
              
              const ref = `heads/${headRef}`;
              
              try {
                // Check if branch still exists
                await github.rest.git.getRef({
                  owner,
                  repo,
                  ref
                });
                
                // Delete the branch
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref
                });
                core.info(`✅ Deleted remote branch: ${headRef}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Branch ${headRef} already deleted`);
                } else {
                  core.warning(`Failed to delete branch ${headRef}: ${error.message}`);
                }
              }
            }
