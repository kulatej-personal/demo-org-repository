
name: Automated Deployment (SharePoint Input)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to deploy from'
        required: true
        type: string
      destination_branch:
        description: 'Destination branch to deploy to'
        required: true
        type: string
      github_token:
        description: 'GitHub Personal Access Token (PAT) with repo and workflow permissions'
        required: true
        type: string
      sharepoint_file_url:
        description: >
          SharePoint link to CSV/XLSX containing a **File Names** column.
          Each cell may hold a single value or comma-separated values.
          (We match by base name only; extensions are ignored.)
        required: true
        type: string
      # Optional: only needed if the SharePoint link requires authentication
      graph_tenant_id:
        description: 'Entra ID (Azure AD) Tenant ID for Microsoft Graph (optional)'
        required: false
        type: string
      graph_client_id:
        description: 'App (Client) ID registered in Entra ID (optional)'
        required: false
        type: string
      graph_client_secret:
        description: 'Client secret for the app (optional)'
        required: false
        type: string
      exclude_files:
        description: 'Files to exclude (defaults applied)'
        required: false
        type: string
        default: 'source.yml,relx_fivetran_connector_mapping.csv'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-deployment-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ inputs.github_token }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl requests

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Validate branches exist
        id: validate
        run: |
          set -e
          if ! git ls-remote --heads origin "${{ inputs.source_branch }}" | grep -q refs/heads; then
            echo "Error: Source branch '${{ inputs.source_branch }}' does not exist on origin"
            exit 1
          fi
          if ! git ls-remote --heads origin "${{ inputs.destination_branch }}" | grep -q refs/heads; then
            echo "Error: Destination branch '${{ inputs.destination_branch }}' does not exist on origin"
            exit 1
          fi
          echo "Branches validated successfully"

      - name: Process SharePoint file (CSV/XLSX)
        id: process_sp_file
        run: |
          python3 << 'EOF'
          import os, sys, base64, re
          import pandas as pd
          import requests
          from io import BytesIO

          sp_url = """${{ inputs.sharepoint_file_url }}""".strip()
          tenant_id = """${{ inputs.graph_tenant_id }}""".strip()
          client_id = """${{ inputs.graph_client_id }}""".strip()
          client_secret = """${{ inputs.graph_client_secret }}""".strip()

          if not sp_url:
              print("Error: sharepoint_file_url input was empty.")
              sys.exit(1)

          def is_sharepoint(u:str)->bool:
              return re.search(r'\.sharepoint\.com', u, re.IGNORECASE) is not None

          def try_direct_download(u:str):
              print("[SharePoint] Attempting direct download...")
              r = requests.get(u, timeout=30, allow_redirects=True)
              if r.status_code == 200:
                  return r.content
              # Append &download=1 to force download for many SPO links
              if "?" in u:
                  u_dl = u + "&download=1"
              else:
                  u_dl = u + "?download=1"
              print(f"[SharePoint] Retrying with force-download: {u_dl}")
              r = requests.get(u_dl, timeout=30, allow_redirects=True)
              if r.status_code == 200:
                  return r.content
              print(f"[SharePoint] Direct download failed with status {r.status_code}")
              return None

          def graph_download_via_shares(u:str):
              if not (tenant_id and client_id and client_secret):
                  raise RuntimeError("This SharePoint link may require auth. Provide graph_tenant_id, graph_client_id, and graph_client_secret.")

              # Client credentials flow for Microsoft Graph
              token_url = f"https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token"
              data = {
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "grant_type": "client_credentials",
                  "scope": "https://graph.microsoft.com/.default"
              }
              print("[Graph] Requesting OAuth token...")
              t = requests.post(token_url, data=data, timeout=30)
              t.raise_for_status()
              access_token = t.json()["access_token"]

              # Encode sharing URL: base64 -> unpadded base64url -> prefix u!
              b64 = base64.b64encode(u.encode("utf-8")).decode("utf-8")
              encoded = "u!" + b64.rstrip("=").replace("/", "_").replace("+", "-")
              endpoint = f"https://graph.microsoft.com/v1.0/shares/{encoded}/driveItem/content"
              print(f"[Graph] Download via shares endpoint: {endpoint}")

              resp = requests.get(
                  endpoint,
                  headers={"Authorization": f"Bearer {access_token}"},
                  allow_redirects=True, timeout=60
              )
              resp.raise_for_status()
              return resp.content

          def load_dataframe(content: bytes, url_hint: str):
              lower = url_hint.lower()
              try:
                  if lower.endswith(".csv"):
                      return pd.read_csv(BytesIO(content))
                  elif lower.endswith(".xlsx") or lower.endswith(".xls"):
                      return pd.read_excel(BytesIO(content))
                  else:
                      # Try CSV, then Excel
                      try:
                          return pd.read_csv(BytesIO(content))
                      except Exception:
                          return pd.read_excel(BytesIO(content))
              except Exception as e:
                  raise RuntimeError(f"Failed to parse file: {e}")

          def extract_names(df: pd.DataFrame):
              print(f"[Parser] Columns available: {list(df.columns)}")
              file_col = None
              for col in df.columns:
                  s = str(col).lower()
                  if "file" in s and "name" in s:
                      file_col = col
                      break
              if not file_col:
                  raise RuntimeError("Could not find a 'File Names' column.")

              all_files = []
              for val in df[file_col].dropna():
                  # Each cell can have a single value or comma-separated list
                  for f in str(val).split(","):
                      f = f.strip()
                      if f:
                          # Strip extension if provided
                          base = f.rsplit(".", 1)[0] if "." in f else f
                          all_files.append(base)

              # Deduplicate while preserving order
              unique_files = list(dict.fromkeys(all_files))
              if not unique_files:
                  raise RuntimeError("No file names extracted from 'File Names' column.")

              # Persist for downstream steps
              with open("/tmp/deployment_files.txt", "w") as fh:
                  fh.write("\n".join(unique_files))

              print(f"[Parser] Extracted {len(unique_files)} unique base names:")
              for f in unique_files:
                  print(f"  - {f}")

          # ---- Main flow ----
          content = None
          if is_sharepoint(sp_url):
              content = try_direct_download(sp_url)
              if content is None:
                  print("[SharePoint] Falling back to Microsoft Graph...")
                  content = graph_download_via_shares(sp_url)
          else:
              print("[Generic] Non-SharePoint URL; fetching via HTTP.")
              r = requests.get(sp_url, timeout=30, allow_redirects=True)
              r.raise_for_status()
              content = r.content

          if content is None:
              print("Error: Unable to download content from the provided SharePoint link.")
              sys.exit(1)

          df = load_dataframe(content, sp_url)
          print(f"[Parser] Loaded {len(df)} row(s)")
          extract_names(df)
          EOF

      - name: Create merger branch (sanitized name)
        id: create_branch
        run: |
          set -e
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SRC=$(echo "${{ inputs.source_branch }}" | tr '[:upper:]' '[:lower:]' | sed 's/[\/ ]/_/g')
          DST=$(echo "${{ inputs.destination_branch }}" | tr '[:upper:]' '[:lower:]' | sed 's/[\/ ]/_/g')
          MERGER_BRANCH="${SRC}_to_${DST}_merger_${TIMESTAMP}"
          echo "merger_branch=${MERGER_BRANCH}" >> "$GITHUB_OUTPUT"
          git fetch origin "${{ inputs.destination_branch }}"
          git checkout -b "${MERGER_BRANCH}" "origin/${{ inputs.destination_branch }}"
          git push -u origin "${MERGER_BRANCH}"
          echo "Created and pushed merger branch: ${MERGER_BRANCH}"

      - name: Get changed files from source branch
        id: get_changes
        run: |
          set -e
          git fetch origin "${{ inputs.source_branch }}"
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "origin/${{ inputs.destination_branch }}...origin/${{ inputs.source_branch }}" || true)
          echo "$CHANGED_FILES" > /tmp/all_changed_files.txt
          FILE_COUNT=$(echo "$CHANGED_FILES" | grep -v '^$' | wc -l || true)
          echo "total_changes=${FILE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "Total files changed: ${FILE_COUNT}"

      - name: Match files by name (ignore extensions)
        id: match_files
        run: |
          set -e
          if [ -f "/tmp/deployment_files.txt" ]; then
            echo "Using file names from SharePoint input"
            FILE_NAMES_SOURCE="/tmp/deployment_files.txt"
          else
            echo "No SharePoint file names parsed; will deploy all changes"
            FILE_NAMES_SOURCE=""
          fi

          if [ -n "$FILE_NAMES_SOURCE" ]; then
            MATCHED_FILES=""
            ALL_SOURCE_FILES=$(git ls-tree -r --name-only "origin/${{ inputs.source_branch }}")

            while IFS= read -r requested_name; do
              requested_name=$(echo "$requested_name" | xargs)
              if [ -z "$requested_name" ]; then
                continue
              fi
              echo "Looking for files matching: $requested_name"
              while IFS= read -r source_file; do
                file_basename=$(basename "$source_file")
                file_without_ext="${file_basename%.*}"
                if [ "$(echo "$file_without_ext" | tr '[:upper:]' '[:lower:]')" = "$(echo "$requested_name" | tr '[:upper:]' '[:lower:]')" ]; then
                  echo "  ✓ Matched: $source_file"
                  MATCHED_FILES="${MATCHED_FILES}${source_file}"$'\n'
                fi
              done <<< "$ALL_SOURCE_FILES"
            done < "$FILE_NAMES_SOURCE"

            echo "$MATCHED_FILES" > /tmp/matched_files.txt
            MATCH_COUNT=$(echo "$MATCHED_FILES" | grep -v '^$' | wc -l || echo 0)
            echo "Total matched files: $MATCH_COUNT"
          fi

      - name: Cherry-pick / Checkout files from source into merger branch
        id: cherry_pick
        run: |
          set -e
          MERGER_BRANCH="${{ steps.create_branch.outputs.merger_branch }}"
          git checkout "${MERGER_BRANCH}"

          EXCLUDE_FILES="${{ inputs.exclude_files }}"
          IFS=',' read -ra EXCLUDE_ARRAY <<< "$EXCLUDE_FILES"

          # Determine which files to deploy
          if [ -f "/tmp/matched_files.txt" ]; then
            echo "Deploying matched files from SharePoint input"
            FILES_TO_PROCESS=$(cat /tmp/matched_files.txt)
          else
            echo "Deploying all changed files (with exclusions)"
            FILES_TO_PROCESS=$(cat /tmp/all_changed_files.txt || true)
          fi

          FILES_TO_DEPLOY=""
          while IFS= read -r file; do
            file=$(echo "$file" | xargs)
            [ -z "$file" ] && continue
            SKIP=false
            for pat in "${EXCLUDE_ARRAY[@]}"; do
              pat=$(echo "$pat" | xargs)
              [ -z "$pat" ] && continue
              if echo "$file" | grep -F -q "$pat"; then
                SKIP=true
                echo "Excluding: $file (matches exclude pattern: $pat)"
                break
              fi
            done
            if [ "$SKIP" = false ]; then
              FILES_TO_DEPLOY="${FILES_TO_DEPLOY}${file}"$'\n'
            fi
          done <<< "$FILES_TO_PROCESS"

          echo "$FILES_TO_DEPLOY" > /tmp/files_to_deploy.txt

          DEPLOYED_FILES=""
          FAILED_FILES=""
          DEPLOYED_COUNT=0

          git fetch origin "${{ inputs.source_branch }}"

          while IFS= read -r f; do
            file=$(echo "$f" | xargs)
            [ -z "$file" ] && continue
            echo "Processing: $file"
            if git cat-file -e "origin/${{ inputs.source_branch }}:${file}" 2>/dev/null; then
              mkdir -p "$(dirname "$file")" || true
              if git checkout "origin/${{ inputs.source_branch }}" -- "$file"; then
                git add --force "$file"
                DEPLOYED_FILES="${DEPLOYED_FILES}- ${file}"$'\n'
                DEPLOYED_COUNT=$((DEPLOYED_COUNT + 1))
                echo "✓ Successfully deployed: $file"
              else
                FAILED_FILES="${FAILED_FILES}- ${file} (checkout failed)"$'\n'
                echo "✗ Failed to checkout: $file"
              fi
            else
              FAILED_FILES="${FAILED_FILES}- ${file} (not found in source branch)"$'\n'
              echo "✗ File not found in source branch: $file"
            fi
          done <<< "$(cat /tmp/files_to_deploy.txt || true)"

          echo "$DEPLOYED_FILES" > /tmp/deployed_files.txt || true
          echo "$FAILED_FILES" > /tmp/failed_files.txt || true
          echo "${DEPLOYED_COUNT}" > /tmp/deployed_count.txt || true

          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          fi

      - name: Commit changes
        id: commit_changes
        if: steps.cherry_pick.outputs.has_changes == 'true'
        run: |
          set -e
          DEPLOYED_FILES=$(cat /tmp/deployed_files.txt || true)
          DEPLOYED_COUNT=$(cat /tmp/deployed_count.txt || echo 0)
          git commit -m "Deploy from ${{ inputs.source_branch }} to ${{ inputs.destination_branch }}" \
                     -m "Deployed ${DEPLOYED_COUNT} file(s):" \
                     -m "$DEPLOYED_FILES" \
                     -m "" \
                     -m "Source: ${{ inputs.source_branch }}" \
                     -m "Destination: ${{ inputs.destination_branch }}" \
                     -m "Triggered by: ${{ github.actor }}" || true
          git push origin "${{ steps.create_branch.outputs.merger_branch }}"

      - name: Restore excluded files from destination (safe)
        if: steps.cherry_pick.outputs.has_changes == 'true'
        run: |
          set -e
          EXCLUDE_FILES="${{ inputs.exclude_files }}"
          IFS=',' read -ra EXCLUDE_ARRAY <<< "$EXCLUDE_FILES"
          RESTORED_FILES=""
          git fetch origin "${{ inputs.destination_branch }}"

          for exclude_pattern in "${EXCLUDE_ARRAY[@]}"; do
            exclude_pattern=$(echo "$exclude_pattern" | xargs)
            [ -z "$exclude_pattern" ] && continue
            MATCHING_FILES=$(git ls-tree -r --name-only "origin/${{ inputs.destination_branch }}" | grep -F "$exclude_pattern" || true)
            [ -z "$MATCHING_FILES" ] && { echo "No files matched exclude pattern: $exclude_pattern"; continue; }
            while IFS= read -r file; do
              file=$(echo "$file" | xargs)
              [ -z "$file" ] && continue
              if git cat-file -e "origin/${{ inputs.destination_branch }}:${file}" 2>/dev/null; then
                git checkout "origin/${{ inputs.destination_branch }}" -- "$file" 2>/dev/null || true
                RESTORED_FILES="${RESTORED_FILES}- ${file}"$'\n'
                echo "Restored: $file"
              fi
            done <<< "$MATCHING_FILES"
          done

          if [ -n "$RESTORED_FILES" ] && [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Restore excluded files from destination branch" -m "Restored files:" -m "$RESTORED_FILES" || true
            git push origin "${{ steps.create_branch.outputs.merger_branch }}"
          else
            echo "No excluded files restored or nothing to commit"
          fi

      - name: Create Pull Request
        if: steps.cherry_pick.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        id: create_pr
        env:
          GITHUB_TOKEN: ${{ inputs.github_token }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          DESTINATION_BRANCH: ${{ inputs.destination_branch }}
          MERGER_BRANCH: ${{ steps.create_branch.outputs.merger_branch }}
          DEPLOYER: ${{ github.actor }}
          SHAREPOINT_URL: ${{ inputs.sharepoint_file_url }}
        with:
          github-token: ${{ inputs.github_token }}
          script: |
            const fs = require('fs');
            const deployedFiles = fs.existsSync('/tmp/deployed_files.txt') ? fs.readFileSync('/tmp/deployed_files.txt','utf8') : '';
            const failedFiles = fs.existsSync('/tmp/failed_files.txt') ? fs.readFileSync('/tmp/failed_files.txt','utf8') : '';
            const allChanges = fs.existsSync('/tmp/all_changed_files.txt') ? fs.readFileSync('/tmp/all_changed_files.txt','utf8') : '';
            const deployedCount = fs.existsSync('/tmp/deployed_count.txt') ? fs.readFileSync('/tmp/deployed_count.txt','utf8').trim() : '0';
            const filesList = allChanges.split('\n').filter(f => f.trim());

            const src = process.env.SOURCE_BRANCH || '';
            const dst = process.env.DESTINATION_BRANCH || '';
            const headBranch = process.env.MERGER_BRANCH || '';
            const actor = process.env.DEPLOYER || '';
            const spUrl = process.env.SHAREPOINT_URL || '';

            let bodyText = '## 🚀 Deployment Request (SharePoint Input)\\n\\n';
            bodyText += `**Source Branch:** \\`${src}\\`\\n`;
            bodyText += `**Destination Branch:** \\`${dst}\\`\\n`;
            bodyText += `**Triggered by:** @${actor}\\n\\n`;
            bodyText += '### 📋 Deployment Summary\\n\\n';
            bodyText += `**Mode:** SharePoint file link\\n`;
            bodyText += `**Deployment file:** ${spUrl}\\n`;
            bodyText += `**Successfully deployed:** ${deployedCount} files\\n\\n`;

            bodyText += '### ✅ Successfully Deployed Files\\n';
            bodyText += '```\\n' + (deployedFiles || 'None') + '\\n```\\n\\n';

            if (failedFiles.trim()) {
              bodyText += '### ⚠️ Failed Files\\n';
              bodyText += '```\\n' + failedFiles + '\\n```\\n\\n';
            }

            bodyText += '### 🔒 Excluded Files (Auto-restored from destination if present)\\n';
            bodyText += '- source.yml\\n- relx_fivetran_connector_mapping.csv\\n\\n';

            bodyText += '### 📝 Next Steps\\n';
            bodyText += '1. Review the changes in this PR\\n';
            bodyText += '2. Approve the PR if everything looks correct\\n';
            bodyText += '3. Merge to deploy to `' + dst + '`\\n';
            bodyText += '4. **Manual Step**: Run your dbt jobs after merge\\n\\n';

            bodyText += `### 📊 All Changed Files in Source\\n<details><summary>Click to expand (${filesList.length} files)</summary>\\n\\n`;
            filesList.forEach(file => { bodyText += `- ${file}\\n`; });
            bodyText += `\\n</details>`;

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy: ${src} → ${dst} (SharePoint file)`,
              head: headBranch,
              base: dst,
              body: bodyText
            });

            return pr.data.number;

      - name: Add labels to PR
        if: steps.cherry_pick.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ inputs.github_token }}
          PR_NUMBER: ${{ steps.create_pr.outputs.result }}
        with:
          github-token: ${{ inputs.github_token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER || 0);
            if (!prNumber) {
              console.log('No PR number available; skipping label addition.');
              return;
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['automated-deployment', 'deployment', 'sharepoint-input']
              });
              console.log('Labels added to PR:', prNumber);
            } catch (error) {
              console.log('Could not add labels (they may not exist):', error.message);
            }

      - name: Summary
        if: steps.cherry_pick.outputs.has_changes == 'true'
        run: |
          echo "## ✅ Deployment PR Created Successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**PR Number:** ${{ steps.create_pr.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Merger Branch:** \`${{ steps.create_branch.outputs.merger_branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Deployment Mode:** SharePoint Link" >> "$GITHUB_STEP_SUMMARY"
          echo "**Deployment File:** ${{ inputs.sharepoint_file_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Next Steps:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Review the PR at the link above" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Request review from your team" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Merge after approval" >> "$GITHUB_STEP_SUMMARY"
          echo "4. **Manually run your dbt jobs after merge**" >> "$GITHUB_STEP_SUMMARY"

      - name: No changes summary
        if: steps.cherry_pick.outputs.has_changes == 'false'
        run: |
          echo "## ℹ️ No Changes to Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No differences found between branches or all files were excluded." >> "$GITHUB_STEP_SUMMARY"
