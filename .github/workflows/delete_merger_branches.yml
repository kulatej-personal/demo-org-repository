# Delete temporary merger branch when its PR is merged.
# Trigger: pull_request.closed (only when PR is merged)
# Behavior: 
#   1. Verify the PR was created by the automated deployment workflow
#   2. Check if the head branch matches the merger pattern (*_to_*_merger_*)
#   3. Delete the remote branch only if all checks pass
#
# Safety features:
#   - Only deletes branches created by automated deployment
#   - Verifies branch naming pattern
#   - Checks for deployment labels
#   - Logs all actions for audit trail

name: Delete Merger Branches latest

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-temp-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Check if PR is from automated deployment and delete branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const headRef = pr.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;
            const prTitle = pr.title;
            const prLabels = pr.labels.map(l => l.name);
            
            core.info(`🔍 Checking PR #${prNumber}: ${prTitle}`);
            core.info(`📋 Head branch: ${headRef}`);
            core.info(`🏷️  Labels: ${prLabels.join(', ') || 'none'}`);
            
            // Check 1: Verify branch naming pattern
            // Pattern: <any>_to_<any>_merger_<timestamp>
            const mergerPattern = /.+_to_.+_merger_\d{8}_\d{6}/;
            
            if (!mergerPattern.test(headRef)) {
              core.info('❌ Head branch does not match merger pattern; skipping delete.');
              core.info('   Expected pattern: *_to_*_merger_YYYYMMDD_HHMMSS');
              return;
            }
            
            core.info('✅ Branch matches merger pattern');
            
            // Check 2: Verify this PR was created by automated deployment
            // Look for deployment labels or title pattern
            const hasDeploymentLabel = prLabels.some(label => 
              label === 'automated-deployment' || label === 'deployment'
            );
            
            const hasDeploymentTitle = prTitle.includes('Deployment Request:') || 
                                      prTitle.includes('Deployment:') ||
                                      prTitle.match(/.*\s*→\s*.*/);
            
            if (!hasDeploymentLabel && !hasDeploymentTitle) {
              core.warning('⚠️  PR does not appear to be from automated deployment workflow');
              core.warning('   Missing deployment labels and title pattern');
              core.warning('   Skipping branch deletion for safety');
              return;
            }
            
            if (hasDeploymentLabel) {
              core.info('✅ PR has deployment label');
            }
            if (hasDeploymentTitle) {
              core.info('✅ PR has deployment title pattern');
            }
            
            // Check 3: Verify branch still exists before attempting delete
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${headRef}`
              });
              core.info('✅ Branch exists and can be deleted');
            } catch (error) {
              if (error.status === 404) {
                core.info('ℹ️  Branch already deleted or does not exist');
                return;
              }
              throw error;
            }
            
            // All checks passed - proceed with deletion
            const ref = `heads/${headRef}`;
            
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref
              });
              
              core.info(`🗑️  Successfully deleted remote branch: ${headRef}`);
              core.info(`✨ Cleanup completed for PR #${prNumber}`);
              
              // Optional: Add a comment to the PR confirming cleanup
              try {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `🤖 **Automated Cleanup**\n\nTemporary merger branch \`${headRef}\` has been automatically deleted after merge.`
                });
              } catch (commentError) {
                core.warning('Could not add cleanup comment to PR');
              }
              
            } catch (error) {
              core.error(`❌ Failed to delete branch ${headRef}: ${error.message}`);
              
              // Optional: Add a comment about the failure
              try {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `⚠️ **Automated Cleanup Failed**\n\nCould not automatically delete temporary branch \`${headRef}\`. You may need to delete it manually.\n\nError: ${error.message}`
                });
              } catch (commentError) {
                core.warning('Could not add error comment to PR');
              }
              
              throw error;
            }

      - name: Summary
        if: success()
        run: |
          echo "## ✅ Merger Branch Cleanup Completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**PR Number:** #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch Deleted:** \`${{ github.event.pull_request.head.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**PR Title:** ${{ github.event.pull_request.title }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The temporary merger branch has been automatically cleaned up." >> "$GITHUB_STEP_SUMMARY"

      - name: Failure Summary
        if: failure()
        run: |
          echo "## ⚠️ Merger Branch Cleanup Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**PR Number:** #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.event.pull_request.head.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Please check the logs and consider deleting the branch manually if needed." >> "$GITHUB_STEP_SUMMARY"
