name: Manual Pull Request Deployment

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch (e.g., dev-release)'
        required: true
      destination_branch:
        description: 'Destination branch (e.g., sit-release)'
        required: true
      target_files:
        description: 'Comma-separated list of scripts/files to migrate (leave empty for all except exclusions)'
        required: false

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git user as workflow actor
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Set up deployment branch
        run: |
          DEPLOY_BRANCH="deploy-from-${{ github.event.inputs.source_branch }}-to-${{ github.event.inputs.destination_branch }}-$(date +%Y%m%d%H%M%S)"
          echo "DEPLOY_BRANCH=$DEPLOY_BRANCH" >> $GITHUB_ENV
          git fetch origin ${{ github.event.inputs.source_branch }}:${{ github.event.inputs.source_branch }}
          git fetch origin ${{ github.event.inputs.destination_branch }}:${{ github.event.inputs.destination_branch }}
          git checkout ${{ github.event.inputs.destination_branch }}
          git checkout -b $DEPLOY_BRANCH

      - name: Prepare migration files
        run: |
          # Exclusions
          EXCLUDE_FILES="source.yml relx_fivetran_connector_mapping"
          # If target_files is empty, migrate all except exclusions
          if [ -z "${{ github.event.inputs.target_files }}" ]; then
            FILES=$(git ls-tree -r --name-only ${{ github.event.inputs.source_branch }} | grep -v -E '^(source\.yml|relx_fivetran_connector_mapping)$')
          else
            IFS=',' read -ra arr <<< "${{ github.event.inputs.target_files }}"
            FILES=""
            for file in "${arr[@]}"; do
              file=$(echo $file | xargs) # trim whitespace
              if [[ "$file" != "source.yml" && "$file" != "relx_fivetran_connector_mapping" ]]; then
                FILES="$FILES $file"
              fi
            done
          fi

          # Always get exclusions from destination branch
          git checkout origin/${{ github.event.inputs.destination_branch }} -- source.yml relx_fivetran_connector_mapping

          # Get selected files from source branch
          if [ ! -z "$FILES" ]; then
            git checkout origin/${{ github.event.inputs.source_branch }} -- $FILES
          fi

          git add $FILES source.yml relx_fivetran_connector_mapping
          git commit -m "Deploy selected scripts from ${{ github.event.inputs.source_branch }} to ${{ github.event.inputs.destination_branch }}. Always preserve exclusions from destination."

      - name: Push deployment branch
        run: |
          git push origin $DEPLOY_BRANCH

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: ${{ env.DEPLOY_BRANCH }}
          destination_branch: ${{ github.event.inputs.destination_branch }}
          title: "Deployment: ${{ github.event.inputs.source_branch }} → ${{ github.event.inputs.destination_branch }}"
          body: |
            Manual deployment.
            - Source branch: ${{ github.event.inputs.source_branch }}
            - Destination branch: ${{ github.event.inputs.destination_branch }}
            - Migrated files: ${{ github.event.inputs.target_files || 'All except exclusions' }}
            - Exclusions preserved from destination: source.yml, relx_fivetran_connector_mapping
